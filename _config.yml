# Site
title: Guillaume Haben
description: Software Engineer <br />TELECOM Nancy, FRANCE
url: https://guillaumehaben.github.io
logo: gh.png                                       # Site logo
locale: en_US

# Left Block Images
background:
  homepage: images/home.png                           # this image will be shown on homepage's left block
  post-list: images/home.png             # this image will be shown on post list page
  default-post: images/post_image.jpg   # this image will be shown when post's front matter doesn't specify any image

# Comments
comments: disqus
disqus:
  shortname: guillaumehaben

# Jekyll
permalink:          /:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
sass:
  sass_dir:         assets/_sass
  style:            compressed

# Google Analytics
google-analytics: UA-83176608-1

# Social Links
email:             guillaume.haben@telecomnancy.net
#google.plus:        Pyxouze
twitter:            GuillaumeHaben
facebook:           guillaume.haben
github:             GuillaumeHaben
#stackoverflow:     123456/username   from a "http://stackoverflow.com/users/123456/username" link
#linkedin:          guillaumehaben
#xing:              username
#instagram:          GuillaumeHaben
#lastfm:            username
#tumblr:            username
#pinterest:         username
#foursquare:        username
#steam:              username
#dribbble:          username
#youtube:           username
#soundcloud:        username
#weibo:             username
#flickr:            username
#codepen:           username
#keybase:           username
#xmpp:              username@server.com
#hackernews:        username
#behance:           username

# Gems
gems:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist

# Exclude list
include: [_pages]
exclude: [README.md, Gemfile, Gemfile.lock, _site, src, vendor, CNAME, LICENSE, Rakefile, .sass-cache, .DS_Store]
